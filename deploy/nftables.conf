#!/usr/sbin/nft -f
flush ruleset

table inet pdu_filter {
    chain input {
        type filter hook input priority 0; policy accept;

        iif "lo" accept comment "loopback"

        # SSH management from LAN
        ip saddr 10.0.20.0/24 tcp dport 22 accept
        ip saddr 10.0.10.0/24 tcp dport 22 accept

        # PDU Manager web/API from approved networks only
        ip saddr 10.0.20.0/24 tcp dport { 80, 443 } accept
        ip saddr 10.0.10.0/24 tcp dport { 80, 443 } accept

        # Drop web from anywhere else (incl. WAN-facing networks)
        tcp dport 80 drop
        tcp dport 443 drop
    }
}
