name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Secret scan (regex gate)
        run: |
          # fail on any credential-shaped literal; the two documented throwaway
          # staging strings in install.sh heredocs are allow-listed
          ! grep -rInE '(sk-[A-Za-z0-9_-]{8,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|https?://[^/]*:[^/@]*@)' \
            --exclude-dir=.git --exclude-dir=dist .
          ! grep -rInE '^[A-Z_]+_B64=[A-Za-z0-9+/=]{8,}' --exclude-dir=.git --exclude-dir=dist . \
            | grep -vE 'stage-user|stage-pass-not-a-real-secret|svc-not-a-real-secret|staging-emergency-change-on-first-run'

      - name: Syntax checks
        run: |
          python -m compileall -q app
          for f in deploy/*.sh; do bash -n "$f"; done

      - name: Config schema validation
        run: python -c "import json; json.load(open('config/examples/config.example.json')); print('config example OK')"

      - name: Tests (mock backend, redirected paths, no network, no actuation)
        env:
          PDU_BACKEND: mock
        run: python -m pytest tests/ -q

      - name: Mock-backend action path (no real PDU possible)
        env:
          PDU_BACKEND: mock
        run: |
          python - <<'PY'
          import sys, os
          sys.path.insert(0, "app")
          import mock_pdu_backend as m
          assert m.control("10.0.20.151", 4, "off") == "OFF"
          assert m.control("10.0.20.151", 4, "on") == "ON"
          assert m.control("10.0.20.151", 4, "reboot") == "ON"
          assert m.read_all_states("10.0.20.151")[4]["state"] in ("On", "Off")
          print("mock driver OK — no hardware involved")
          PY

      - name: Build release artifact
        run: |
          git config user.email "ci@startupteams.co" && git config user.name "CI"
          ./deploy/build-release.sh "$(git rev-parse HEAD)"
          test -f "dist/pdu-manager-$(git rev-parse HEAD).tar.gz"
          test -f "dist/pdu-manager-$(git rev-parse HEAD).sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdu-manager-${{ github.sha }}
          path: dist/
          retention-days: 14